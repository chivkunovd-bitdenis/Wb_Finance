name: WB orchestrator recovery regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tests/test_recover_wb_orchestrator_queue.py'
      - 'scripts/recover-orchestrator*'
      - 'docker-compose.orchestrator-recovery.yml'
      - '.github/workflows/wb-orchestrator-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wb_finance
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: wb_finance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wb_finance -d wb_finance_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6387:6379']
    env:
      DATABASE_URL: postgresql://wb_finance:test-only@127.0.0.1:5432/wb_finance_test
      PYTHONPATH: backend
      PYTHON_DOTENV_DISABLED: '1'
      WB_API_KEY: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt ruff
      - name: Install real Redis for isolated preservation tests
        run: sudo apt-get update -qq && sudo apt-get install -y redis-server && command -v redis-server
      - name: Build the complete test database schema
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Offline backend regressions on PostgreSQL
        run: python -m pytest -q backend/tests -m 'not wb_real'
      - name: Selective queue recovery regressions
        run: python -m pytest -q tests/test_recover_wb_orchestrator_queue.py
