name: Ozon finance regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docs/ozon-finance/**'
      - 'TASKLOG.md'
      - '.github/workflows/ozon-finance-pr.yml'
      - '.github/workflows/deploy.yml'
      - 'scripts/release-ozon.sh'
      - 'tests/test_release_ozon_script.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wb_finance
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: wb_finance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wb_finance -d wb_finance_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://wb_finance:local-test-only@127.0.0.1:5432/wb_finance_test
      PYTHONPATH: backend
      PYTHON_DOTENV_DISABLED: '1'
      WB_API_KEY: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Safe release and rollback simulations
        run: python -m pytest -q tests/test_release_ozon_script.py
      - name: Database migration connection with production URL scheme
        working-directory: backend
        run: python -m alembic current
      - name: Backend financial and store isolation regressions
        run: >-
          python -m pytest -q
          backend/tests/test_database_url.py
          backend/tests/test_ozon_client.py
          backend/tests/test_ozon_finance.py
          backend/tests/test_marketplace_finance_api.py
          backend/tests/test_marketplace_finance_service.py
          backend/tests/test_dashboard_api.py
          backend/tests/test_tasks.py
          backend/tests/test_wb_client.py
          backend/tests/test_integration_dashboard.py
          backend/tests/test_integration_store_access.py
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Marketplace UI regressions against local frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/ozon-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5173 > /dev/null && break
            sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:5173 npx playwright test e2e/marketplace-finance.spec.js
