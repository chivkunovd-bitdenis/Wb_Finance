name: Deploy to server

on:
  push:
    branches:
      - main

env:
  # После перехода GitHub на Node 24 по умолчанию — без предупреждений о checkout/setup-python
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            wb_image_pipeline_service/requirements.txt

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt ruff mypy
          pip install -r wb_image_pipeline_service/requirements.txt pytest

      # Как локально: корень репо + mypy.ini / pytest.ini
      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy .

      - name: Pytest (монолит)
        run: pytest -q

      - name: Pytest (wb_image_pipeline_service)
        run: cd wb_image_pipeline_service && python -m pytest tests -q

  deploy:
    name: Deploy via SSH
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: SSH → deploy exact verified SHA
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: RELEASE_SHA
          script: |
            set -euo pipefail
            DEPLOY_DIR="/root/wb-finance"
            git -C "$DEPLOY_DIR" fetch origin main
            test "$(git -C "$DEPLOY_DIR" rev-parse origin/main)" = "$RELEASE_SHA"
            git -C "$DEPLOY_DIR" show "$RELEASE_SHA:scripts/release-ozon.sh" | bash -s -- "$RELEASE_SHA" "$DEPLOY_DIR"
