[project]
name = "wbf-support-bot"
version = "0.1.0"
description = "Бот поддержки клиентов WB Finance: копит сообщения из чатов для живой AI-сессии"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

# Код написан так, чтобы проходить и на Python 3.11 (его использует CI репозитория
# для ruff и mypy), поэтому target-version стоит 3.11, а не 3.12.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
